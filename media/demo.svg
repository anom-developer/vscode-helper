<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="editorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007acc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="popupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#1e1f2e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      /* Animation Sequence */
      @keyframes popover {
        0%, 15% { opacity: 0; transform: translateY(6px); }
        25%, 65% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cursorBlink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes codeTransform {
        0%, 65% { opacity: 1; }
        70% { opacity: 0; }
        75%, 100% { opacity: 1; }
      }
      @keyframes squigglyLine {
        0%, 65% { opacity: 1; }
        70%, 100% { opacity: 0; }
      }
      @keyframes statusChange {
        0%, 65% { fill: #f59e0b; }
        75%, 100% { fill: #10b981; }
      }

      .animated-popup {
        animation: popover 7s infinite cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: 220px 185px;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
      .squiggly {
        animation: squigglyLine 7s infinite;
      }
      .status-pill {
        animation: statusChange 7s infinite;
      }
    </style>
  </defs>

  <!-- Outer Window Frame with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="840" height="400" rx="14" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <path d="M 20 34 Q 20 20 34 20 L 846 20 Q 860 20 860 34 L 860 58 L 20 58 Z" fill="#181825"/>
    
    <!-- macOS Window Dots -->
    <circle cx="44" cy="39" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="64" cy="39" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="84" cy="39" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Window Title -->
    <text x="440" y="43" fill="#a6adc8" font-size="12" class="sans" text-anchor="middle" font-weight="500">Visual Studio Code — app.ts (vscode-helper v0.2.0)</text>

    <!-- Tabs Bar -->
    <rect x="20" y="58" width="840" height="34" fill="#11111b"/>
    <!-- Active Tab (app.ts) -->
    <rect x="20" y="58" width="140" height="34" fill="#181825" stroke="#313244" stroke-width="0.5"/>
    <rect x="20" y="58" width="140" height="2" fill="#007acc"/>
    <text x="36" y="80" fill="#38bdf8" font-size="11" class="mono" font-weight="bold">TS</text>
    <text x="56" y="80" fill="#cdd6f4" font-size="12" class="sans" font-weight="500">app.ts</text>
    <text x="144" y="80" fill="#6c7086" font-size="12" class="sans">×</text>

    <!-- Inactive Tab (rules.py) -->
    <text x="180" y="80" fill="#fab387" font-size="11" class="mono" font-weight="bold">PY</text>
    <text x="202" y="80" fill="#6c7086" font-size="12" class="sans">rules.py</text>

    <!-- Editor Body Area -->
    <rect x="20" y="92" width="840" height="298" fill="url(#editorGrad)"/>

    <!-- Line Numbers Gutter -->
    <rect x="20" y="92" width="48" height="298" fill="#181825" stroke="#313244" stroke-width="0.5"/>
    <g fill="#45475a" font-size="12" class="mono" text-anchor="end">
      <text x="54" y="125">1</text>
      <text x="54" y="153">2</text>
      <text x="54" y="181">3</text>
      <text x="54" y="209">4</text>
      <text x="54" y="237">5</text>
      <text x="54" y="265">6</text>
      <text x="54" y="293">7</text>
      <text x="54" y="321">8</text>
    </g>

    <!-- Code Content -->
    <g class="mono" font-size="13">
      <!-- Line 1: Comment -->
      <text x="82" y="125" fill="#6c7086" font-style="italic">// ⚡ VSCode Helper: Real-time diagnostics &amp; one-click auto-fix</text>

      <!-- Line 2: var user = "Alice" -->
      <text x="82" y="153">
        <tspan fill="#f38ba8" font-weight="bold">var</tspan>
        <tspan fill="#cdd6f4"> user = </tspan>
        <tspan fill="#a6e3a1">"Alice"</tspan>
        <tspan fill="#cdd6f4">;</tspan>
        <tspan fill="#6c7086" font-style="italic">  // 💡 Rule [no-var]</tspan>
      </text>
      <!-- Squiggly underline under var -->
      <path class="squiggly" d="M 82 157 Q 85 160 88 157 T 94 157 T 100 157 T 106 157" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

      <!-- Line 3: if (status == null) -->
      <text x="82" y="181">
        <tspan fill="#cba6f7" font-weight="bold">if</tspan>
        <tspan fill="#cdd6f4"> (status </tspan>
        <tspan fill="#f38ba8" font-weight="bold">==</tspan>
        <tspan fill="#fab387"> null</tspan>
        <tspan fill="#cdd6f4">) {</tspan>
        <tspan fill="#6c7086" font-style="italic">  // 💡 Rule [eqeqeq]</tspan>
      </text>
      <!-- Squiggly underline under == -->
      <path class="squiggly" d="M 174 185 Q 177 188 180 185 T 186 185 T 192 185" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

      <!-- Line 4: console.log -->
      <text x="82" y="209">
        <tspan fill="#cdd6f4">  console.</tspan>
        <tspan fill="#89b4fa">log</tspan>
        <tspan fill="#cdd6f4">(</tspan>
        <tspan fill="#a6e3a1">`User ${user} is ready`</tspan>
        <tspan fill="#cdd6f4">);</tspan>
      </text>

      <!-- Line 5: debugger -->
      <text x="82" y="237">
        <tspan fill="#f38ba8" font-weight="bold">  debugger</tspan>
        <tspan fill="#cdd6f4">;</tspan>
        <tspan fill="#6c7086" font-style="italic">  // 💡 Rule [no-debugger]</tspan>
      </text>
      <path class="squiggly" d="M 98 241 Q 102 244 106 241 T 114 241 T 122 241 T 130 241 T 138 241 T 146 241 T 154 241" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

      <!-- Line 6: closing brace -->
      <text x="82" y="265" fill="#cdd6f4">}</text>

      <!-- Line 7: Python snippet preview -->
      <text x="82" y="293" fill="#6c7086" font-style="italic"># Python support: detects "except:", "x == None", mutable defaults</text>
      <!-- Line 8: Java/C++/Go/Rust snippet preview -->
      <text x="82" y="321" fill="#6c7086" font-style="italic">// Java/C++/Go/Rust: detects "str1 == str2", "NULL", "panic()", "unwrap()"</text>
    </g>

    <!-- Animated Quick Fix Popup -->
    <g class="animated-popup" filter="url(#popupShadow)">
      <!-- Container -->
      <rect x="100" y="158" width="360" height="135" rx="8" fill="url(#popupGrad)" stroke="#45475a" stroke-width="1.2"/>
      
      <!-- Header -->
      <rect x="100" y="158" width="360" height="28" rx="8" fill="#1e1e2e"/>
      <path d="M 100 186 L 460 186" stroke="#313244" stroke-width="1"/>
      <text x="114" y="177" fill="#f9e2af" font-size="12" class="sans" font-weight="bold">💡 Quick Fix (Ctrl + .)</text>
      <text x="445" y="177" fill="#6c7086" font-size="11" class="mono" text-anchor="end">Rule: no-var</text>

      <!-- Action Item 1: Selected / Primary -->
      <rect x="106" y="192" width="348" height="28" rx="5" fill="#313244"/>
      <circle cx="120" cy="206" r="4" fill="#007acc"/>
      <text x="132" y="210" fill="#ffffff" font-size="12" class="sans" font-weight="600">🛠️ Replace 'var' with 'const'</text>
      <text x="444" y="210" fill="#38bdf8" font-size="11" class="mono" text-anchor="end">Enter ↵</text>

      <!-- Action Item 2 -->
      <rect x="106" y="222" width="348" height="24" rx="4" fill="transparent"/>
      <text x="132" y="238" fill="#a6adc8" font-size="12" class="sans">🛠️ Replace 'var' with 'let'</text>

      <!-- Action Item 3 -->
      <rect x="106" y="248" width="348" height="24" rx="4" fill="transparent"/>
      <text x="132" y="264" fill="#a6adc8" font-size="12" class="sans">🛡️ Ignore 'no-var' on this line</text>

      <!-- Action Item 4: Fix All -->
      <text x="132" y="284" fill="#89dceb" font-size="11" class="sans">✨ Fix all auto-fixable issues in file</text>
    </g>

    <!-- Status Bar (Bottom) -->
    <path d="M 20 390 L 860 390 L 860 406 Q 860 420 846 420 L 34 420 Q 20 420 20 406 Z" fill="#181825" stroke="#313244" stroke-width="0.5"/>
    
    <!-- Status Bar Left -->
    <g class="sans" font-size="11" fill="#cdd6f4">
      <rect x="20" y="390" width="32" height="30" fill="#007acc"/>
      <text x="36" y="410" fill="#ffffff" font-size="13" text-anchor="middle">⎇</text>
      <text x="60" y="410" fill="#a6adc8">main*</text>
      <text x="110" y="410" fill="#a6adc8">⊗ 1  ⚠️ 2</text>
    </g>

    <!-- Status Bar Center (VSCode Helper Indicator) -->
    <g class="sans">
      <rect x="340" y="394" width="200" height="22" rx="4" fill="#11111b" stroke="#313244" stroke-width="0.8"/>
      <circle cx="354" cy="405" r="4.5" class="status-pill" fill="#f59e0b"/>
      <text x="366" y="410" fill="#cdd6f4" font-size="11" font-weight="600">VSCode Helper: 3 issues</text>
    </g>

    <!-- Status Bar Right -->
    <g class="sans" font-size="11" fill="#6c7086" text-anchor="end">
      <text x="730" y="410">Ln 2, Col 1</text>
      <text x="790" y="410">UTF-8</text>
      <text x="848" y="410">TypeScript</text>
    </g>
  </g>
</svg>