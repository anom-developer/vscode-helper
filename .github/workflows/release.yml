name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npx tsc -p ./

      - run: npm install -g @vscode/vsce
      - run: vsce package --no-dependencies --allow-missing-publisher -o vscode-helper.vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-helper.vsix
