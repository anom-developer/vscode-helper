name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Package extension
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx vsce package --no-dependencies -o "vscode-helper-${VERSION}.vsix"
          echo "VSIX_PATH=vscode-helper-${VERSION}.vsix" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VSCode Helper v${{ env.VERSION }}"
          body: |
            ## 📦 VSCode Helper v${{ env.VERSION }}

            ### Install
            1. Download `vscode-helper-${{ env.VERSION }}.vsix` below
            2. In VS Code: `Ctrl+Shift+P` → **Extensions: Install from VSIX...**

            Or via terminal:
            ```bash
            code --install-extension vscode-helper-${{ env.VERSION }}.vsix
            ```

            ---
            See [CHANGELOG.md](https://github.com/AceAnomDev/vscode-helper/blob/main/CHANGELOG.md) for details.
          files: ${{ env.VSIX_PATH }}
          generate_release_notes: true
